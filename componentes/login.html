
<div class="modal-contenido login-moderno" role="dialog"
     aria-modal="true" aria-labelledby="tituloLogin">

    <button id="cerrarLogin" class="modal-cerrar"
            type="button" aria-label="Cerrar ventana">
        ✕
    </button>

    <div class="login-encabezado">
        <div class="login-icono">🪽</div>
        <div class="etiqueta">ALAS DEL EMPRENDIMIENTO</div>
        <h2 id="tituloLogin">
            ¡Qué bueno <span class="texto-neon">verte!</span>
        </h2>
        <p>Ingresa y descubre nuevas oportunidades.</p>
    </div>

    <form id="formularioLogin" class="formulario-login">

        <label for="correoLogin">Correo electrónico</label>
        <div class="login-campo">
            <span aria-hidden="true">✉</span>
            <input id="correoLogin" name="correo" type="email"
                   autocomplete="email" required
                   placeholder="ejemplo@correo.com">
        </div>

        <label for="contrasenaLogin">Contraseña</label>
        <div class="login-campo">
            <span aria-hidden="true">🔒</span>
            <input id="contrasenaLogin" name="contrasena"
                   type="password" autocomplete="current-password"
                   required placeholder="Escribe tu contraseña">
        </div>

        <button id="btnIniciarSesion" class="btn-principal login-boton"
                type="submit">
            Iniciar sesión <span aria-hidden="true">→</span>
        </button>

        <p id="mensajeLogin" class="login-mensaje"
           role="status" aria-live="polite"></p>

        
        <p class="login-pie">
         Tu próximo emprendimiento comienza aquí.
        </p> 

         <p class="login-registro">
         ¿No tienes cuenta?
         <a href="#" id="abrirRegistro">Registrarme</a>
        </p>


    </form>
</div>
